<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2e7cf">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Dorf der Baumeister</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: Kopfzeile mit Vorräten, darunter Karte (links) und Bau-Leiste (rechts); auf dem Handy untereinander.
   Bewusst nur ein helles Thema: ein Bilderbuch-Spiel. Die Farben wechseln mit dem gewählten Volk. */
:root{
  --bg:#f2e7cf; --panel:#fffaee; --ink:#2d2416; --muted:#6e6250; --line:#e0cfa9;
  --accent:#1f5fa8; --accent2:#d9a227; --good:#2f8a3a; --bad:#c2412d;
  --display:'Grandstander','Comic Sans MS',system-ui,sans-serif;
  --body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
body[data-civ="wichtel"]{--bg:#e4eed6;--panel:#fbfdf4;--ink:#20301b;--muted:#566650;--line:#c9dab5;--accent:#b8392c;--accent2:#5f9334}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:var(--body);font-size:15px;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.small{padding:5px 10px;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1100px;margin:0 auto}

/* Startbildschirm */
#start{display:flex;flex-direction:column;gap:22px}
.hero{text-align:center;padding-top:8px}
.hero h1{font-size:clamp(34px,8vw,58px);font-weight:800;letter-spacing:.5px;line-height:1.05}
.hero p{color:var(--muted);margin:8px auto 0;max-width:46ch}
.civs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.civ{border:3px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:0 5px 0 var(--ink);background:var(--panel)}
.civ:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.civ canvas{width:100%;height:auto;border-radius:12px;border:2px solid var(--ink);display:block}
.civ h2{font-size:28px}
.civ p{margin:0;color:var(--muted)}
.civ.egypt{background:#fbf0d4}.civ.wichtel{background:#eef6e2}
.namerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.namerow input{font:inherit;font-size:17px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0;width:220px}
.saves{border-top:2px dashed var(--line);padding-top:16px}
.saves h3{font-size:20px;margin-bottom:10px}
.slotlist{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel);flex-wrap:wrap}
.slot .meta{flex:1;min-width:0}
.slot .meta b{font-family:var(--display);font-size:17px}
.slot .meta div{color:var(--muted);font-size:14px}
.slot .acts{display:flex;gap:8px}
.empty{color:var(--muted);font-size:14px}

/* Spiel */
#game{display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:24px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{display:flex;align-items:center;gap:8px;min-width:0}
.badge{font-family:var(--display);font-weight:800;background:var(--accent2);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;white-space:nowrap}
.xpbar{width:120px;height:12px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.xptxt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;gap:4px}
.speed button{border:2px solid var(--ink);background:var(--panel);border-radius:8px;padding:3px 9px;font-weight:700}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.r{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.r .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.r .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
@media (max-width:560px){.res{grid-template-columns:repeat(6,minmax(0,1fr))}.r{grid-column:span 2}.r:nth-child(n+4){grid-column:span 3}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:auto;box-sizing:border-box;margin:0 auto;max-width:100%;background:var(--ink);box-shadow:0 5px 0 var(--ink);line-height:0}
#map{display:block;touch-action:manipulation}
#map.paint{touch-action:none}
.floater{position:absolute;pointer-events:none;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;line-height:1;animation:fl 1.2s ease-out forwards}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-44px);opacity:0}}
.tip{background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--accent2);border-radius:12px;padding:8px 12px;font-size:15px}
.quest{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.quest .qb{flex:1;min-width:180px}
.quest .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.quest .bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.quest .bar i{display:block;height:100%;background:var(--good);transition:width .4s}
.quest .rw{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:6px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tabs.sm button{padding:4px 2px;font-size:13px}
.tools{display:flex;gap:6px}
.tool{flex:1;border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:6px 8px;font-weight:700;font-size:14px}
.tool[aria-pressed="true"]{background:var(--accent2);color:#fff}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:560px;overflow-y:auto;padding:2px}
@media (max-width:820px){.palette{display:flex;overflow-x:auto;overflow-y:hidden;max-height:none;padding-bottom:8px;scroll-snap-type:x proximity}.card{flex:0 0 132px;scroll-snap-align:start}}
.card{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;position:relative}
.card canvas{width:100%;aspect-ratio:1.4;border-radius:8px;display:block;max-width:100%}
.card b{font-size:14px;line-height:1.15}
.card .cost{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.card .cost .no{color:var(--bad);font-weight:700}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card.locked{filter:grayscale(1);opacity:.6}
.card .lock{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--panel);border-radius:6px;font-size:12px;padding:1px 6px;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.job{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 10px}
.job .ico{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--accent)}
.job.locked{opacity:.5}.job.locked .ico{background:var(--muted)}
.job .t{flex:1;min-width:0}.job .t div{font-size:13px;color:var(--muted)}
.job .n{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.stats span:nth-child(even){font-variant-numeric:tabular-nums;font-weight:700;text-align:right}

/* Fenster */
.veil{position:fixed;inset:0;background:rgba(30,22,10,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:26px}
.dlg p{margin:0}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg textarea{font:13px/1.3 ui-monospace,monospace;width:100%;box-sizing:border-box;min-height:90px;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink);resize:vertical}
.unl{display:flex;flex-direction:column;gap:6px}
.unl div{background:var(--bg);border-radius:10px;padding:6px 10px}
.stars{font-family:var(--display);font-size:46px;text-align:center;color:var(--accent2);line-height:1;text-shadow:0 3px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.floater{animation:none;opacity:0}.xpbar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <section id="start">
    <div class="hero">
      <h1>Dorf der Baumeister</h1>
      <p>Baue dein eigenes Dorf, sammle Erfahrung und schalte neue Häuser und Berufe frei. Welches Volk möchtest du anführen?</p>
    </div>
    <div class="namerow">
      <label for="vname"><b>Name deines Dorfes:</b></label>
      <input id="vname" maxlength="22" placeholder="z. B. Sonnenstadt">
    </div>
    <div class="civs">
      <button class="civ egypt" id="pickEgypt"><canvas id="prevEgypt" width="520" height="240"></canvas><h2>Ägypter</h2><p>Am großen Fluss Nil. Baue mit Stein und Lehm, bis zur Großen Pyramide.</p></button>
      <button class="civ wichtel" id="pickWichtel"><canvas id="prevWichtel" width="520" height="240"></canvas><h2>Waldwichtel</h2><p>Tief im Zauberwald. Baue Pilzhäuser aus Holz, bis zur Riesen-Eiche.</p></button>
    </div>
    <div class="saves">
      <h3>Gespeicherte Spiele</h3>
      <div class="slotlist" id="startSlots"></div>
      <p style="margin-top:12px"><button class="btn small" id="importBtn">Spielstand-Code einfügen</button></p>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <h1 id="gName">Dorf</h1>
      <div class="lvl"><span class="badge" id="gLvl">Level 1</span><div class="xpbar"><i id="gXp"></i></div><span class="xptxt" id="gXpT"></span></div>
      <div class="speed" role="group" aria-label="Spieltempo">
        <button id="sp0" aria-pressed="false" title="Pause">II</button>
        <button id="sp1" aria-pressed="true" title="Normal">▶</button>
        <button id="sp2" aria-pressed="false" title="Schnell">▶▶</button>
      </div>
      <button class="btn small" id="menuBtn">Speichern</button>
    </div>
    <div class="res">
      <div class="r"><span class="k">Gold</span><span class="v" id="rG">0</span><span class="d" id="dG"></span></div>
      <div class="r"><span class="k" id="kF">Essen</span><span class="v" id="rF">0</span><span class="d" id="dF"></span></div>
      <div class="r"><span class="k" id="kM">Stein</span><span class="v" id="rM">0</span><span class="d" id="dM"></span></div>
      <div class="r"><span class="k">Leute</span><span class="v" id="rP">0</span><span class="d" id="dP"></span></div>
      <div class="r"><span class="k">Laune</span><span class="v" id="rH">0</span><span class="d" id="dH"></span></div>
    </div>
    <div class="main">
      <div id="mapcol" style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="mapbox" id="mapbox"><canvas id="map"></canvas></div>
        <div class="quest" id="quest"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="side">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="bau">Bauen</button>
          <button role="tab" aria-selected="false" data-tab="beruf">Berufe</button>
          <button role="tab" aria-selected="false" data-tab="dorf">Dorf</button>
        </div>
        <div id="tab-bau" class="side">
          <div class="tools">
            <button class="tool" id="toolLook" aria-pressed="true">Ansehen</button>
            <button class="tool" id="toolDig" aria-pressed="false">Bagger</button>
          </div>
          <div class="tabs sm" id="cats"><button data-cat="alle" aria-selected="true">Alle</button><button data-cat="wohnen" aria-selected="false">Wohnen</button><button data-cat="arbeit" aria-selected="false">Arbeit</button><button data-cat="schmuck" aria-selected="false">Schmuck</button></div>
          <div class="palette" id="palette"></div>
        </div>
        <div id="tab-beruf" class="list" hidden></div>
        <div id="tab-dorf" hidden></div>
      </div>
    </div>
  </section>
</div>
<div id="veil" class="veil" hidden><div class="dlg" id="dlg"></div></div>

<script>
(function(){
"use strict";
const W=24,H=24;
const SIZES=[12,12,12,14,14,14,16,16,16,18,18,20,22,24,24]; // sichtbare Kantenlänge je Level 1..15
const MAXL=15;
function ringFor(l){return (W-SIZES[l-1])/2}
const LV=[0,40,110,220,380,600,900,1300,1800,2500,3500,4800,6500,8500,11000]; // XP für Level 2..15
const CIV={
  egypt:{key:'egypt',idx:0,name:'Ägypter',village:'Sonnenstadt',mat:'Stein',food:'Brot',ground:['#ecd59f','#e6cd92','#f0dcab'],water:'#3f8fc9',water2:'#7ab9e4',obst:['fels','palme']},
  wichtel:{key:'wichtel',idx:1,name:'Waldwichtel',village:'Moosgrund',mat:'Holz',food:'Beeren',ground:['#94c873','#8bc06a','#9fd07e'],water:'#4aa3c8',water2:'#86c8e2',obst:['baum','fels']}
};
const DEFS=[
 {id:'weg',lvl:1,g:2,m:0,n:['Weg','Moospfad'],t:'Häuser direkt am Weg machen ihre Bewohner froher.'},
 {id:'haus',lvl:1,g:15,m:8,houses:4,n:['Lehmhaus','Pilzhaus'],t:'Hier wohnen 4 Leute.'},
 {id:'feld',lvl:1,g:10,m:2,w:2,prod:{food:3},n:['Weizenfeld','Beerenbeet'],j:['Bauer','Beerensammler'],t:'Macht Essen für alle.'},
 {id:'werk',lvl:1,g:12,m:0,w:2,prod:{mat:2},n:['Steinbruch','Holzfäller-Hütte'],j:['Steinmetz','Holzfäller'],t:'Liefert Baumaterial.'},
 {id:'brunnen',lvl:2,g:20,m:10,happy:6,n:['Brunnen','Tauquelle'],t:'Frisches Wasser macht froh.'},
 {id:'markt',lvl:2,g:25,m:15,w:2,prod:{gold:4},n:['Basar','Tauschstand'],j:['Händler','Tauschwichtel'],t:'Bringt Gold ins Dorf.'},
 {id:'deko',lvl:2,g:8,m:0,happy:3,n:['Palmengarten','Blumenwiese'],t:'Hübsch anzusehen. Etwas mehr gute Laune.'},
 {id:'saege',lvl:3,g:30,m:10,w:3,prod:{mat:5},n:['Steinsägerei','Sägewerk'],j:['Steinsäger','Säger'],t:'Liefert viel mehr Baumaterial als der Anfangs-Betrieb.'},
 {id:'fischer',lvl:3,g:20,m:10,w:2,prod:{food:6},water:1,n:['Fischerhütte','Angelsteg'],j:['Fischer','Angler'],t:'Viel Essen. Muss direkt am Wasser stehen.'},
 {id:'denkmal',lvl:3,g:40,m:30,happy:10,n:['Obelisk','Glühwürmchen-Laterne'],t:'Ein Schmuckstück für das ganze Dorf.'},
 {id:'stall',lvl:4,g:30,m:15,w:2,prod:{food:5},n:['Gänsehof','Pilzgarten'],j:['Hirte','Pilzbauer'],t:'Noch mehr Essen für dein Dorf.'},
 {id:'spiel',lvl:4,g:30,m:20,happy:8,n:['Spielplatz','Kletterbaum'],t:'Hier spielen die Kinder. Viel gute Laune!'},
 {id:'baecker',lvl:4,g:35,m:20,w:2,prod:{food:-2,gold:6},happy:4,n:['Bäckerei','Honigküche'],j:['Bäcker','Imker'],t:'Macht aus Essen Leckereien zum Verkaufen.'},
 {id:'werkstatt',lvl:5,g:45,m:30,w:3,prod:{mat:-1,gold:9},n:['Töpferei','Schnitzerei'],j:['Töpfer','Schnitzer'],t:'Macht aus Baumaterial wertvolle Waren.'},
 {id:'schule',lvl:5,g:50,m:35,w:2,prod:{xp:3},happy:3,n:['Schreiberschule','Wichtelschule'],j:['Schreiber','Lehrer'],t:'Kluge Köpfe: mehr Erfahrungspunkte.'},
 {id:'turm',lvl:6,g:60,m:50,w:2,prod:{xp:2,gold:2},happy:3,n:['Wachturm','Eulenturm'],j:['Wächter','Eulenwächter'],t:'Von oben sieht man weit ins Land.'},
 {id:'tempel',lvl:6,g:80,m:60,w:3,happy:18,n:['Tempel','Mondsteinkreis'],j:['Priester','Mondweise'],t:'Ein besonderer Ort. Viel gute Laune.'},
 {id:'villa',lvl:7,g:60,m:45,houses:10,happy:2,n:['Villa','Baumhaus'],t:'Ein großes Haus für 10 Leute.'},
 {id:'hafen',lvl:8,g:90,m:60,w:4,prod:{gold:16},water:1,n:['Nilhafen','Blätterboot-Steg'],j:['Schiffer','Flößer'],t:'Handel übers Wasser. Muss am Wasser stehen.'},
 {id:'palast',lvl:9,g:200,m:150,w:4,happy:25,prod:{xp:5},n:['Palast des Pharao','Großer Wichtelbaum'],j:['Wesir','Ältestenrat'],t:'Hier wohnt das Oberhaupt deines Dorfes.'},
 {id:'reihe',lvl:4,g:40,m:25,houses:6,n:['Ziegelhaus','Doppel-Pilzhaus'],t:'Hier wohnen 6 Leute.'},
 {id:'mine',lvl:5,g:55,m:40,w:3,prod:{gold:8,mat:1},n:['Kupfermine','Kristallhöhle'],j:['Bergmann','Kristallsucher'],t:'Glitzernde Schätze bringen Gold.'},
 {id:'garten',lvl:6,g:45,m:30,happy:10,n:['Königsgarten','Heckenlabyrinth'],t:'Ein Ort zum Spazieren und Freuen.'},
 {id:'muehle',lvl:6,g:55,m:40,w:3,prod:{food:9},n:['Windmühle','Pilzmühle'],j:['Müller','Müllerwichtel'],t:'Macht richtig viel Essen.'},
 {id:'heiler',lvl:7,g:60,m:40,w:2,happy:12,n:['Heilhaus','Kräuterhaus'],j:['Heiler','Kräuterweise'],t:'Wer gesund ist, ist froh.'},
 {id:'bibliothek',lvl:8,g:80,m:60,w:3,prod:{xp:6},happy:4,n:['Bibliothek','Geschichtenbaum'],j:['Bibliothekar','Geschichtenerzähler'],t:'Bücher machen schlau: viel Erfahrung.'},
 {id:'arena',lvl:9,g:100,m:70,w:3,prod:{gold:10},happy:20,n:['Festplatz','Tanzwiese'],j:['Gaukler','Tänzer'],t:'Hier wird gefeiert. Gute Laune und Gold.'},

function P(ctx,x,y,s){
  const u=s/16,X=a=>x+a*u,Y=b=>y+b*u;
  return {
    rect(a,b,w,h,c){ctx.fillStyle=c;ctx.fillRect(X(a),Y(b),w*u,h*u)},
    circ(a,b,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(X(a),Y(b),r*u,0,7);ctx.fill()},
    ell(a,b,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(X(a),Y(b),rx*u,ry*u,0,0,7);ctx.fill()},
    half(a,b,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(X(a),Y(b),rx*u,ry*u,0,Math.PI,0);ctx.closePath();ctx.fill()},
    poly(p,c){ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();ctx.fill()},
    line(p,c,w){ctx.strokeStyle=c;ctx.lineWidth=w*u;ctx.lineCap='round';ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.stroke()},
    sh(w){this.ell(8,14.6,w||6,1.3,'rgba(0,0,0,.2)')}
  };
}

  const jobsOpen=c.jobs-(S.pop-c.free);
  if(c.free===0&&jobsOpen>0)return`In manchen Gebäuden fehlen Arbeiter. Baue: <b>${nm('haus')}</b>, damit mehr Leute einziehen.`;
  if(c.happy<40)return S.level>=2?`Die Laune ist schlecht. Das hilft: <b>${nm('brunnen')}</b>, <b>${nm('deko')}</b>${S.level>=4?`, <b>${nm('spiel')}</b>`:''}.`:`Die Laune sinkt. Lege <b>${nm('weg')}</b> direkt an deine Häuser.`;
  if(S.pop>=c.cap)return`Alle Häuser sind voll. Baue: <b>${nm('haus')}</b>, dann ziehen mehr Leute ein.`;
  if(c.happy<35)return'Bei schlechter Laune zieht niemand ein.';
  if(S.level<MAXL)return`Noch ${fmt(LV[S.level]-S.xp)} Erfahrung bis Level ${S.level+1}. Dann gibt es: ${DEFS.filter(d=>d.lvl===S.level+1).map(d=>nm(d.id)).join(', ')}.`;
  return S.won?'Du hast das Weltwunder gebaut. Dein Dorf ist berühmt!':`Spare auf das Weltwunder: ${nm('wunder')}!`;
}
function thumb(cnv,id){const c=cnv.getContext('2d'),w=cnv.width,h=cnv.height,s=Math.min(w,h)*.78;c.clearRect(0,0,w,h);c.fillStyle=CIV[S.civ].ground[0];c.fillRect(0,0,w,h);
  if(id==='fischer'||id==='hafen'||id==='werft'||id==='leuchtturm'){c.fillStyle=CIV[S.civ].water;c.fillRect(0,h*.78,w,h*.22)}
  drawObj(c,id,S.civ,(w-s)/2,h-s-(id==='wunder'?h*.02:h*.06),s)}
function cat(d){return d.houses||d.id==='weg'?'wohnen':d.w?'arbeit':'schmuck'}
function renderPalette(){const pal=$('palette');pal.innerHTML='';const i=CIV[S.civ].idx;
  DEFS.filter(d=>pcat==='alle'||cat(d)===pcat).forEach(d=>{const b=document.createElement('button');b.className='card';b.dataset.id=d.id;b.setAttribute('aria-pressed',tool===d.id);
    b.innerHTML=`<canvas width="140" height="100"></canvas><b>${d.n[i]}</b><span class="cost"></span>`+(d.lvl>S.level?`<span class="lock">ab Level ${d.lvl}</span>`:'');
    if(d.lvl>S.level)b.classList.add('locked');
    b.onclick=()=>{if(d.lvl>S.level){toast(d.n[i]+' gibt es ab Level '+d.lvl+'.');return}setTool(tool===d.id?'look':d.id)};
    pal.appendChild(b);thumb(b.querySelector('canvas'),d.id)});
  updateCards();}
function updateCards(){document.querySelectorAll('.card').forEach(b=>{const d=DEF[b.dataset.id];
  b.querySelector('.cost').innerHTML=`<span class="${S.gold<d.g?'no':''}">${d.g} Gold</span>`+(d.m?` · <span class="${S.mat<d.m?'no':''}">${d.m} ${CIV[S.civ].mat}</span>`:'');})}
function setTool(t){tool=t;document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===t));
  $('toolLook').setAttribute('aria-pressed',t==='look');$('toolDig').setAttribute('aria-pressed',t==='dig');cv.classList.toggle('paint',t==='weg'||t==='dig')}
function renderJobs(c){c=c||compute();const i=CIV[S.civ].idx,el=$('tab-beruf');
  let h='<p style="margin:0 0 4px;color:var(--muted);font-size:14px">Jedes Arbeitsgebäude braucht Leute mit dem passenden Beruf. Neue Berufe gibt es mit neuen Leveln.</p>';
  DEFS.filter(d=>d.w).forEach(d=>{const lk=d.lvl>S.level,n=c.byJob[d.id]||0,cnt=S.buildings.filter(b=>b.id===d.id).length;
    h+=`<div class="job ${lk?'locked':''}"><div class="ico">${d.j[i][0]}</div><div class="t"><b>${d.j[i]}</b><div>${lk?'Freigeschaltet ab Level '+d.lvl:'arbeitet in: '+d.n[i]}</div></div><div class="n">${lk?'':n+' / '+cnt*d.w}</div></div>`});
  el.innerHTML=h}
function renderDorf(c){c=c||compute();const el=$('tab-dorf');
  el.innerHTML=`<div class="stats"><span>Tag</span><span>${S.day}</span><span>Bewohner</span><span>${S.pop} von ${c.cap}</span><span>Arbeitsplätze</span><span>${c.jobs}</span><span>Ohne Arbeit</span><span>${c.free}</span><span>Gebäude</span><span>${S.buildings.filter(b=>b.id!=='weg').length}</span><span>Häuser am Weg</span><span>${c.path}</span><span>Volk</span><span>${CIV[S.civ].name}</span><span>Land</span><span>${VN} × ${VN} Felder</span>${c.boost?`<span>Fest-Laune</span><span>noch ${S.boostUntil-S.day} Tage</span>`:''}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn small" id="dSave">Speichern</button><button class="btn small" id="dSound">Ton: ${soundOn?'an':'aus'}</button><button class="btn small" id="dHome">Hauptmenü</button></div>`;
  $('dSave').onclick=saveMenu;$('dSound').onclick=()=>{soundOn=!soundOn;renderDorf()};$('dHome').onclick=()=>{autosave();showStart()};}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(q=>q.setAttribute('aria-selected',q===b));
  ['bau','beruf','dorf'].forEach(t=>$('tab-'+t).hidden=t!==tab);ui()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{pcat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(q=>q.setAttribute('aria-selected',q===b));renderPalette();$('palette').scrollTo(0,0)});
$('toolLook').onclick=()=>setTool('look');$('toolDig').onclick=()=>setTool('dig');
[0,1,2].forEach(i=>$('sp'+i).onclick=()=>setSpeed(i));
$('menuBtn').onclick=saveMenu;

/* ---------- Fenster ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dialog(html){$('dlg').innerHTML=html;$('veil').hidden=false;$('dlg').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDlg);const f=$('dlg').querySelector('button');if(f)f.focus()}
function closeDlg(){$('veil').hidden=true}
$('veil').addEventListener('click',e=>{if(e.target===$('veil'))closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('veil').hidden)closeDlg();else setTool('look')}});
let tt;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function levelUp(l){const i=CIV[S.civ].idx,news=DEFS.filter(d=>d.lvl===l);
  dialog(`<div class="stars">★ ★ ★</div><h2 style="text-align:center">Level ${l} erreicht!</h2><p style="text-align:center">Dein Dorf wächst. Das ist jetzt neu:</p><div class="unl">${ringFor(l)!==ringFor(l-1)?'<div><b>Dein Land wird größer!</b><br><span style="font-size:14px;color:var(--muted)">Am Rand gibt es neuen Platz zum Bauen.</span></div>':''}${news.map(d=>`<div><b>${d.n[i]}</b>${d.j?' · neuer Beruf: <b>'+d.j[i]+'</b>':''}<br><span style="font-size:14px;color:var(--muted)">${d.t}</span></div>`).join('')}</div><div class="row"><button class="btn primary" data-close>Super!</button></div>`)}
function win(){dialog(`<div class="stars">★ ★ ★ ★ ★</div><h2 style="text-align:center">Du hast gewonnen!</h2><p style="text-align:center">${esc(S.name)} hat jetzt ${S.civ==='egypt'?'die Große Pyramide':'die Riesen-Eiche'}. Alle im Land reden von deinem Dorf. Du kannst gern weiterbauen.</p><div class="row"><button class="btn primary" data-close>Weiterbauen</button></div>`);beep([523,659,784,1047,1319],.15)}

/* ---------- Speichern ---------- */
const KEY='dorfbau.slots.v1',AUTO='dorfbau.auto.v1';
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function slots(){const s=lsGet(KEY);return Array.isArray(s)&&s.length===3?s:[null,null,null]}
function pack(){return{name:S.name,civ:S.civ,level:S.level,day:S.day,pop:S.pop,at:Date.now(),data:S}}
function autosave(){if(S){lsSet(AUTO,pack());if(curSlot!==null){const s=slots();s[curSlot]=pack();lsSet(KEY,s)}}}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function fromCode(c){const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!o||!o.map||!CIV[o.civ])throw 0;return o}
function when(t){const d=new Date(t);return d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function slotLine(s){return s?`<b>${esc(s.name)}</b><div>${CIV[s.civ].name} · Level ${s.level} · Tag ${s.day} · ${s.pop} Bewohner · ${when(s.at)}</div>`:'<b>Leerer Platz</b><div>Noch nichts gespeichert</div>'}
function saveMenu(){const s=slots();
  dialog(`<h2>Spiel speichern</h2><p>Wähle einen von drei Speicherplätzen. Das Spiel speichert außerdem alle paar Tage automatisch.</p><div class="slotlist">${s.map((x,i)=>`<div class="slot"><div class="meta">${slotLine(x)}</div><div class="acts"><button class="btn small" data-save="${i}">${x?'Überschreiben':'Hier speichern'}</button></div></div>`).join('')}</div>
  <p style="font-size:14px;color:var(--muted)">Spielstand-Code: Damit kannst du dein Dorf auf ein anderes Gerät mitnehmen oder sicher aufbewahren.</p><textarea id="codeOut" readonly>${code()}</textarea>
  <div class="row"><button class="btn small" id="copyCode">Code kopieren</button><button class="btn primary" data-close>Fertig</button></div>`);
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const i=+b.dataset.save,s2=slots();if(s2[i]&&!b.dataset.sure&&curSlot!==i){b.dataset.sure=1;b.textContent='Sicher?';return}
    s2[i]=pack();if(lsSet(KEY,s2)){curSlot=i;toast('Gespeichert auf Platz '+(i+1)+'.');saveMenu()}else toast('Speichern geht in diesem Browser nicht. Nutze den Spielstand-Code.')});
  $('copyCode').onclick=()=>{const t=$('codeOut');navigator.clipboard&&navigator.clipboard.writeText(t.value).then(()=>toast('Code kopiert.'),()=>{t.select();toast('Code markiert. Jetzt kopieren.')})||(t.select())};
}
function loadState(o,slot){S=o;curSlot=slot;startGame();toast('Willkommen zurück in '+S.name+'!')}
function renderStartSlots(){const s=slots(),a=lsGet(AUTO);let h='';
  if(a)h+=`<div class="slot"><div class="meta">${slotLine(a).replace('<b>','<b>Automatisch: ')}</div><div class="acts"><button class="btn small primary" data-load="auto">Weiterspielen</button></div></div>`;
  s.forEach((x,i)=>{if(x)h+=`<div class="slot"><div class="meta">${slotLine(x)}</div><div class="acts"><button class="btn small primary" data-load="${i}">Laden</button><button class="btn small" data-del="${i}">Löschen</button></div></div>`});
  $('startSlots').innerHTML=h||'<p class="empty">Noch kein Spiel gespeichert. Wähle oben ein Volk, um anzufangen.</p>';
  document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const k=b.dataset.load;if(k==='auto')loadState(a.data,null);else loadState(slots()[+k].data,+k)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Wirklich?';return}const s2=slots();s2[+b.dataset.del]=null;lsSet(KEY,s2);renderStartSlots()});
}
$('importBtn').onclick=()=>{dialog(`<h2>Spielstand-Code</h2><p>Füge hier deinen Code ein.</p><textarea id="codeIn" placeholder="Code hier einfügen"></textarea><div class="row"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="codeGo">Laden</button></div>`);
  $('codeGo').onclick=()=>{try{const o=fromCode($('codeIn').value);closeDlg();loadState(o,null)}catch(e){toast('Der Code passt nicht. Bitte komplett kopieren.')}}};

/* ---------- Aufgaben ---------- */
function cnt(id){return S.buildings.filter(b=>b.id===id).length}
const QB=(id,r,n)=>({id,t:()=>`Baue ${n||1}× ${nm(id)}`,p:()=>[cnt(id),n||1],r});
const Q=[
 QB('haus',{gold:20},2), QB('werk',{gold:20}),
 {t:()=>`Lege 5 Felder ${nm('weg')}`,p:()=>[cnt('weg'),5],r:{gold:15}},
 {t:()=>'Habe 10 Bewohner',p:()=>[S.pop,10],r:{mat:15}},
 {t:()=>'Erreiche Level 2',p:()=>[S.level,2],r:{gold:30}},
 QB('brunnen',{mat:20}), QB('markt',{gold:30}), QB('deko',{food:20}),
 {t:()=>'Habe 20 Bewohner',p:()=>[S.pop,20],r:{food:30}},
 {t:()=>'Bringe die Laune auf 70 %',p:()=>[S.happy,70],r:{xp:30}},
 QB('saege',{mat:30}), QB('fischer',{gold:30}), QB('denkmal',{gold:40}),
 QB('stall',{food:40}), QB('spiel',{gold:40}),
 {t:()=>'Sammle 250 Gold',p:()=>[S.gold,250],r:{mat:50}},
 {t:()=>'Habe 40 Bewohner',p:()=>[S.pop,40],r:{gold:60}},
 QB('schule',{xp:60}), QB('werkstatt',{mat:40}), QB('tempel',{gold:80}), QB('turm',{mat:60}),
 {t:()=>'Habe 70 Bewohner',p:()=>[S.pop,70],r:{gold:100}},
 QB('villa',{mat:80}), QB('hafen',{gold:120}), QB('palast',{gold:150,mat:100}),
 QB('reihe',{gold:60}), QB('mine',{mat:60}), QB('garten',{xp:60}), QB('muehle',{food:80}), QB('heiler',{gold:100}), QB('bibliothek',{xp:90}), QB('arena',{gold:150}),
 {t:()=>'Habe 100 Bewohner',p:()=>[S.pop,100],r:{gold:200,mat:100}},
 QB('werft',{gold:200}), QB('sternwarte',{xp:120}), QB('turmhaus',{mat:150}), QB('sphinx',{gold:300}), QB('akademie',{xp:150}),
 {t:()=>'Habe 150 Bewohner',p:()=>[S.pop,150],r:{gold:300,mat:200}},
 QB('leuchtturm',{gold:300}), QB('markthalle',{gold:400}), QB('zoo',{xp:200}), QB('festung',{mat:300}),
 {t:()=>'Sammle 3000 Gold',p:()=>[S.gold,3000],r:{xp:300}},
 {id:'wunder',t:()=>`Baue das Weltwunder: ${nm('wunder')}`,p:()=>[cnt('wunder'),1],r:{xp:100}}
];
function rwText(r){return Object.keys(r).map(k=>r[k]+' '+label(k)).join(' + ')}
function checkQuest(){while(S.quest<Q.length){const q=Q[S.quest],[a,b]=q.p();if(a<b)break;S.quest++;
  for(const k in q.r){if(k==='xp')addXP(q.r[k]);else S[k]+=q.r[k]}toast('Aufgabe geschafft! Belohnung: '+rwText(q.r));beep([784,988,1175],.09)}}
function renderQuest(){const el=$('quest');
  if(S.quest>=Q.length){el.innerHTML='<div class="qb"><div class="lab">Aufgaben</div><b>Alle Aufgaben geschafft! Du bist ein echter Baumeister.</b></div>';return}
  const q=Q[S.quest],[a,b]=q.p(),lock=q.id&&DEF[q.id].lvl>S.level;
  el.innerHTML=`<div class="qb"><div class="lab">Aufgabe ${S.quest+1} von ${Q.length}</div><b>${q.t()}</b>${lock?` <span style="color:var(--muted);font-size:13px">(ab Level ${DEF[q.id].lvl})</span>`:''}<div class="bar"><i style="width:${Math.min(100,a/b*100)}%"></i></div></div><div class="rw">${fmt(Math.min(a,b))} / ${fmt(b)}<br>Belohnung: ${rwText(q.r)}</div>`}

/* ---------- Ereignisse ---------- */
const EV={egypt:[
 ['Die Nilflut ist da!','Das Wasser macht die Felder fruchtbar.',{food:35}],
 ['Eine Karawane kommt vorbei','Händler aus der Wüste kaufen bei euch ein.',{gold:45}],
 ['Fest für den Sonnengott','Alle feiern. Die Laune steigt für 20 Tage.',{boost:1}],
 ['Heuschrecken!','Ein Schwarm hat Getreide aus dem Vorrat gefressen.',{food:-20}],
 ['Ein Sandsturm','Der Wind hat schöne Steine freigelegt.',{mat:25}]],
 wichtel:[
 ['Warmer Regen','Die Beeren wachsen um die Wette.',{food:35}],
 ['Wanderwichtel zu Besuch','Sie bringen Geschenke mit.',{gold:45}],
 ['Glühwürmchenfest','Alle tanzen. Die Laune steigt für 20 Tage.',{boost:1}],
 ['Freche Igel!','Sie haben Beeren aus dem Vorrat stibitzt.',{food:-20}],
 ['Ein Herbststurm','Abgebrochene Äste geben Holz.',{mat:25}]]};
function fireEvent(){const l=EV[S.civ],e=l[Math.floor(Math.random()*l.length)],r=e[2],res=[];
  for(const k in r){if(k==='boost'){S.boostUntil=S.day+20;res.push('+15 Laune für 20 Tage')}else{const v=Math.round(r[k]*(1+S.level*.25));S[k]=Math.max(0,S[k]+v);res.push((v>0?'+':'')+v+' '+label(k))}}
  dialog(`<h2>${e[0]}</h2><p>${e[1]}</p><div class="unl"><div><b>${res.join(', ')}</b></div></div><div class="row"><button class="btn primary" data-close>OK</button></div>`);
  beep(r.food<0?[392,330]:[587,740,880],.1);ui()}

/* ---------- Alte Spielstände übernehmen ---------- */
function expand(o,old){
  const n=24,off=(n-old)/2,m=genMap(o.civ,o.seed||1),nm=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const ox=x-off,oy=y-off;
    if(ox>=0&&oy>=0&&ox<old&&oy<old){nm.push(o.map[oy*old+ox]);continue}
    const sx=Math.min(old-1,Math.max(0,ox)),sy=Math.min(old-1,Math.max(0,oy)),w=o.map[sy*old+sx].w,f=m[y*n+x];
    nm.push({w:w,o:(w||f.w)?null:f.o,b:null})}
  o.map=nm;o.buildings.forEach(b=>{b.x+=off;b.y+=off});o.v=3}
function migrate(o){
  if(o.map.length===144)expand(o,12);else if(o.map.length===256)expand(o,16);
  if(o.quest==null)o.quest=0;if(o.nextEv==null)o.nextEv=o.day+20;if(o.boostUntil==null)o.boostUntil=0}

/* ---------- Ton ---------- */
let AC=null;function beep(fr,len){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();fr.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*len;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+len*1.6);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+len*1.7)})}catch(e){}}

/* ---------- Start ---------- */
function startGame(){migrate(S);walkers=[];document.body.dataset.civ=S.civ;$('start').hidden=true;$('game').hidden=false;tool='look';renderPalette();setTool('look');size(false);setSpeed(1);ui();autosave()}
function showStart(){clearInterval(timer);S=null;$('game').hidden=true;$('start').hidden=false;document.body.dataset.civ='';closeDlg();renderStartSlots();previews()}
function previews(){[['prevEgypt','egypt',['haus','feld','denkmal','markt','wunder']],['prevWichtel','wichtel',['haus','feld','denkmal','baecker','wunder']]].forEach(([id,civ,items])=>{
  const c=$(id).getContext('2d'),w=520,h=240,s=80;const keep=S;S={civ};
  for(let y=0;y<3;y++)for(let x=0;x<7;x++){c.fillStyle=groundCol(civ,x,y);c.fillRect(x*s-20,y*s,s,s)}
  if(civ==='egypt'){c.fillStyle=CIV.egypt.water;c.fillRect(0,0,60,h)}else{c.fillStyle=CIV.wichtel.water;c.fillRect(0,200,w,40)}
  [[0,1.1],[1,1.6],[2,.7],[3,1.6],[4,.8]].forEach((q,i)=>drawObj(c,items[i],civ,[70,150,240,320,400][i],[95,140,80,140,40][i],i===4?110:s));
  drawObj(c,civ==='egypt'?'palme':'baum',civ,0,50,70);drawObj(c,civ==='egypt'?'palme':'baum',civ,440,140,70);S=keep})}
$('pickEgypt').onclick=()=>newGame('egypt',$('vname').value.trim());
$('pickWichtel').onclick=()=>newGame('wichtel',$('vname').value.trim());
window.addEventListener('resize',()=>size(true));
if(window.claude&&window.claude.hot)window.claude.hot.snapshot(()=>({S,curSlot}));
function boot(d){if(d&&d.S){S=d.S;curSlot=d.curSlot??null;startGame()}else showStart();requestAnimationFrame(animLoop)}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
